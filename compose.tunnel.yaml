services:
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: x-reader-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://x-reader:8787
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
