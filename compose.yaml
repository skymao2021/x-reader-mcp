services:
  x-reader:
    build: .
    image: x-reader-mcp:0.2.0
    container_name: x-reader-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
